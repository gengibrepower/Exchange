[package]
name = "edge"
version = "0.1.0"
edition = "2024"

[dependencies]
exchange-core = { path = "../core" }
exchange-wal = { path = "../wal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
